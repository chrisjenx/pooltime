name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: docs
        run: sh scripts/check-docs.sh
        env:
          POOLTIME_BIN: target/debug/pooltime
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/check-docs.sh scripts/linux-systemd-e2e.sh

  # The background service under a real systemd user manager: install, a stream in flight across
  # `service restart` and `systemctl --user reload`, no refused connection or 503, uninstall.
  linux-systemd:
    name: linux systemd e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        run: cargo build --bin pooltime
      - name: service install / restart / uninstall
        run: bash scripts/linux-systemd-e2e.sh target/debug/pooltime
