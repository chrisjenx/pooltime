[workspace]
members = [".", "harness"]

[package]
name = "pooltime"
version = "0.1.0"
edition = "2021"
description = "Pool Claude Max and ChatGPT/Codex accounts behind one local Anthropic-compatible endpoint"
license = "MIT"
repository = "https://github.com/chrisjenx/pooltime"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
