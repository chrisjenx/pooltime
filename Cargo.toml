[workspace]
members = [".", "harness"]

[package]
name = "pooltime"
version = "0.1.0"
edition = "2021"
description = "Pool Claude Max and ChatGPT/Codex accounts behind one local Anthropic-compatible endpoint"
license = "MIT"
repository = "https://github.com/chrisjenx/pooltime"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
h2 = "0.4"
hex = "0.4.3"
http = "1.5.0"
humantime-serde = "1.1.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros", "serde-well-known"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
filetime = "0.2.29"
tokio = { version = "1.54.1", features = ["net", "test-util"] }
predicates = "3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
